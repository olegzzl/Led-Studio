<style>
        body { background-color: #131313; color: #e5e2e1; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #444748; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 8px;
            background: #A5A5A5;
            margin-top: -5.5px;
            border-radius: 1px;
            transition: background 0.15s ease;
        }
        input[type=range]:hover::-webkit-slider-thumb { background: #FFFFFF; }
        
        #led-panel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 80px var(--glow-color, rgba(255,255,255,0.1));
        }

        @keyframes strobe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }
        .animate-strobe { animation: strobe 0.1s infinite; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-blink { animation: blink 0.8s infinite; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #353535; }
        ::-webkit-scrollbar-thumb:hover { background: #444748; }
    
        @media (max-width: 768px) {
            input[type=range] {
                height: 32px;
                touch-action: manipulation;
            }
            input[type=range]::-webkit-slider-runnable-track {
                height: 4px;
            }
            input[type=range]::-webkit-slider-thumb {
                height: 24px;
                width: 16px;
                margin-top: -10px;
            }
        }

        /* Accordion Animations */
        .accordion-content {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 1;
        }
        .accordion-content.collapsed {
            grid-template-rows: 0fr;
            opacity: 0;
            pointer-events: none;
        }
        .accordion-inner {
            overflow: hidden;
        }
        .chevron-icon {
            transition: transform 0.3s ease;
        }
        .chevron-icon.collapsed {
            transform: rotate(-90deg);
        }
    </style>

<script>
    const ledPanel = document.getElementById('led-panel');
    const tempSlider = document.getElementById('temp-slider');
    const hueSlider = document.getElementById('hue-slider');
    const brightSlider = document.getElementById('bright-slider');
    
    const tempVal = document.getElementById('temp-val');
    const hueVal = document.getElementById('hue-val');
    const brightVal = document.getElementById('bright-val');

    const btnStrobe = document.getElementById('btn-strobe');
    const btnBlink = document.getElementById('btn-blink');

    // Refined Accordion Logic
    function toggleAccordion(id) {
        const content = document.getElementById('content-' + id);
        const chevron = document.getElementById('chevron-' + id);
        
        if (content && chevron) {
            const isCollapsed = content.classList.contains('collapsed');
            
            // Toggle classes
            if (isCollapsed) {
                content.classList.remove('collapsed');
                chevron.classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                chevron.classList.add('collapsed');
            }
        }
    }

    // Initialize initial state (some collapsed by default to show functionality)
    window.addEventListener('DOMContentLoaded', () => {
        ['mixer', 'presets', 'library'].forEach(id => {
            const content = document.getElementById('content-' + id);
            const chevron = document.getElementById('chevron-' + id);
            if(content && chevron) {
                content.classList.add('collapsed');
                chevron.classList.add('collapsed');
            }
        });
    });

    let isStrobe = false;
    let isBlink = false;

    function updateLED() {
        const temp = parseInt(tempSlider.value);
        const hue = parseInt(hueSlider.value);
        const brightness = parseInt(brightSlider.value);

        tempVal.textContent = temp;
        hueVal.textContent = hue + '°';
        brightVal.textContent = brightness + '%';

        let color;
        const saturation = temp; 
        color = `hsl(${hue}, ${saturation}%, 50%)`;
        
        if (temp === 0) {
            color = `hsl(0, 0%, 100%)`;
        }

        ledPanel.style.backgroundColor = color;
        ledPanel.style.opacity = brightness / 100;
        
        const glowOpacity = (brightness / 100) * 0.5;
        ledPanel.style.setProperty('--glow-color', color.replace('hsl', 'hsla').replace(')', `, ${glowOpacity})`));
    }

    tempSlider.addEventListener('input', updateLED);
    hueSlider.addEventListener('input', updateLED);
    brightSlider.addEventListener('input', updateLED);

    btnStrobe.addEventListener('click', () => {
        isStrobe = !isStrobe;
        isBlink = false;
        ledPanel.classList.remove('animate-blink');
        btnBlink.classList.remove('bg-primary', 'text-on-primary');
        
        if (isStrobe) {
            ledPanel.classList.add('animate-strobe');
            btnStrobe.classList.add('bg-primary', 'text-on-primary');
        } else {
            ledPanel.classList.remove('animate-strobe');
            btnStrobe.classList.remove('bg-primary', 'text-on-primary');
        }
    });

    btnBlink.addEventListener('click', () => {
        isBlink = !isBlink;
        isStrobe = false;
        ledPanel.classList.remove('animate-strobe');
        btnStrobe.classList.remove('bg-primary', 'text-on-primary');

        if (isBlink) {
            ledPanel.classList.add('animate-blink');
            btnBlink.classList.add('bg-primary', 'text-on-primary');
        } else {
            ledPanel.classList.remove('animate-blink');
            btnBlink.classList.remove('bg-primary', 'text-on-primary');
        }
    });

    updateLED();
</script>
